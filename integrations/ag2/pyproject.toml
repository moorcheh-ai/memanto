[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memanto-ag2"
version = "0.1.0"
description = "AG2 (AutoGen) tools for Memanto persistent memory (preview)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<4"
authors = [{ name = "Memanto", email = "info@memanto.ai" }]
dependencies = [
    "memanto>=0.2.21",
    "pydantic>=2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.hatch.build.targets.wheel]
packages = ["memanto_ag2"]

[project.optional-dependencies]
# AG2 1.x is a new API; this integration targets 0.9.x (``from autogen import ...``).
ag2 = ["ag2>=0.9.0,<1"]
dev = ["pytest>=8.0", "ag2>=0.9.0,<1"]
