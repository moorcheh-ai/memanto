[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memanto-vapi"
version = "0.1.0"
description = "Memanto memory for Vapi voice agents: shared knowledge, lessons learned, optional per-caller memory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<4"
authors = [{ name = "Memanto", email = "info@memanto.ai" }]
dependencies = [
    "memanto>=0.2.21",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
memanto-vapi = "memanto_vapi.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["memanto_vapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
