name: Verify cross-process session fix

on:
  push:
    branches:
      - security/cross-process-session-lifecycle
    paths:
      - .github/workflows/verify-cross-process-session.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -q -e '.[all]'
      - name: Focused regression
        run: python -m pytest -q tests/test_session_cross_process_lifecycle.py
      - name: Ruff
        run: python -m ruff check memanto/app/services/session_service.py tests/test_session_cross_process_lifecycle.py
      - name: Diff check
        run: git diff --check origin/main...HEAD
