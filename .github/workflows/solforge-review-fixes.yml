name: SOLFORGE CodeRabbit review fixes

on:
  push:
    branches:
      - security-bounty-1852-conflict-id-binding
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-bounty-1852-conflict-id-binding
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply review fixes
        shell: python
        run: |
          from pathlib import Path

          # 1) Require an active, agent-scoped session before any conflict resolution.
          p = Path('memanto/cli/client/direct_client.py')
          text = p.read_text(encoding='utf-8')
          old = '''        # Get namespace for memory operations\n        from memanto.app.core import agent_namespace\n\n        namespace = agent_namespace(agent_id)\n\n        # LLM-generated conflict IDs are untrusted capability references.\n'''
          new = '''        # Conflict resolution mutates persistent state, so authorize the caller\n        # against the target agent before resolving or deleting anything.\n        session = self._get_validated_session_for_agent(agent_id)\n        namespace = session.namespace\n\n        # LLM-generated conflict IDs are untrusted capability references.\n'''
          if old not in text:
              raise SystemExit('direct_client authorization anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # 2) CLI: clearly mark blocked references as unverified and never offer
          # destructive choices for them.
          p = Path('memanto/cli/commands/memory.py')
          text = p.read_text(encoding='utf-8')
          old = '''            console.print(\n                f"     [dim]Recommendation: {c.get('recommendation', '—')}[/dim]"\n            )\n            console.print()\n'''
          new = '''            binding = c.get("_reference_binding") or {}\n            if binding.get("status") == "blocked":\n                console.print(\n                    f"     [red]UNVERIFIED: {binding.get('reason', 'reference validation failed')}[/red]"\n                )\n            else:\n                console.print(\n                    f"     [dim]Recommendation: {c.get('recommendation', '—')}[/dim]"\n                )\n            console.print()\n'''
          if old not in text:
              raise SystemExit('CLI list anchor not found')
          text = text.replace(old, new, 1)

          old = '''        color = type_colors.get(ctype, "white")\n        rec = c.get("recommendation", "merge")\n\n        # Build the display panel\n'''
          new = '''        color = type_colors.get(ctype, "white")\n        rec = c.get("recommendation", "merge")\n        binding = c.get("_reference_binding") or {}\n        unverified = binding.get("status") == "blocked"\n\n        # Build the display panel\n'''
          if old not in text:
              raise SystemExit('CLI interactive status anchor not found')
          text = text.replace(old, new, 1)

          old = '''        lines.append(f"[bold]AI Recommendation:[/bold]  {rec_display.get(rec, rec)}")\n\n        console.print(\n'''
          new = '''        if unverified:\n            lines.append(\n                f"[bold red]UNVERIFIED REFERENCES:[/bold red] "\n                f"{binding.get('reason', 'reference validation failed')}"\n            )\n        else:\n            lines.append(f"[bold]AI Recommendation:[/bold]  {rec_display.get(rec, rec)}")\n\n        console.print(\n'''
          if old not in text:
              raise SystemExit('CLI panel anchor not found')
          text = text.replace(old, new, 1)

          old = '''        # Prompt options with recommendation markers\n        def _opt(key, label, rec_val, current_rec=rec):\n'''
          new = '''        # Blocked references are intentionally not actionable. The user must\n        # regenerate a verified report before any destructive choice is offered.\n        if unverified:\n            console.print(\n                "[red]Destructive resolution disabled for this unverified conflict. "\n                "Regenerate the conflict report after fixing the reference issue.[/red]\\n"\n            )\n            skipped_count += 1\n            continue\n\n        # Prompt options with recommendation markers\n        def _opt(key, label, rec_val, current_rec=rec):\n'''
          if old not in text:
              raise SystemExit('CLI choices anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # 3) Browser UI: label blocked conflicts Unverified and disable all
          # destructive/manual actions while leaving Keep Both as the safe no-op.
          p = Path('memanto/app/ui/static/index.html')
          text = p.read_text(encoding='utf-8')
          old = '''            const badge = document.createElement('span');\n            badge.className = 'badge badge-warning';\n            badge.style.marginLeft = '8px';\n            badge.textContent = 'Unresolved';\n            headerLeft.append(typeSpan, badge);\n'''
          new = '''            const binding = c._reference_binding || {};\n            const unverified = binding.status === 'blocked';\n            const badge = document.createElement('span');\n            badge.className = unverified ? 'badge badge-danger' : 'badge badge-warning';\n            badge.style.marginLeft = '8px';\n            badge.textContent = unverified ? 'Unverified' : 'Unresolved';\n            headerLeft.append(typeSpan, badge);\n'''
          if old not in text:
              raise SystemExit('browser badge anchor not found')
          text = text.replace(old, new, 1)

          old = '''            const actions = document.createElement('div');\n            actions.className = 'conflict-actions';\n            actions.append(\n                conflictActionBtn('Keep Old', 'btn-secondary', () => resolveConflict(cid, rawAgentId, rawDate, 'keep_old')),\n                conflictActionBtn('Keep New', 'btn-primary', () => resolveConflict(cid, rawAgentId, rawDate, 'keep_new')),\n                conflictActionBtn('Keep Both', 'btn-secondary', () => resolveConflict(cid, rawAgentId, rawDate, 'keep_both')),\n                conflictActionBtn('Remove Both', 'btn-danger', () => resolveConflict(cid, rawAgentId, rawDate, 'remove_both')),\n                conflictActionBtn('Manual', 'btn-secondary', () => showManualResolve(cid)),\n            );\n'''
          new = '''            const actions = document.createElement('div');\n            actions.className = 'conflict-actions';\n            const keepOldBtn = conflictActionBtn('Keep Old', 'btn-secondary', () => resolveConflict(cid, rawAgentId, rawDate, 'keep_old'));\n            const keepNewBtn = conflictActionBtn('Keep New', 'btn-primary', () => resolveConflict(cid, rawAgentId, rawDate, 'keep_new'));\n            const keepBothBtn = conflictActionBtn('Keep Both', 'btn-secondary', () => resolveConflict(cid, rawAgentId, rawDate, 'keep_both'));\n            const removeBothBtn = conflictActionBtn('Remove Both', 'btn-danger', () => resolveConflict(cid, rawAgentId, rawDate, 'remove_both'));\n            const manualBtn = conflictActionBtn('Manual', 'btn-secondary', () => showManualResolve(cid));\n            if (unverified) {\n                [keepOldBtn, keepNewBtn, removeBothBtn, manualBtn].forEach(btn => {\n                    btn.disabled = true;\n                    btn.title = 'Disabled: conflict references are unverified';\n                });\n                const warning = document.createElement('div');\n                warning.style.cssText = 'color:var(--danger);font-size:12px;margin:8px 0';\n                warning.textContent = `Unverified references: ${binding.reason || 'reference validation failed'}. Destructive actions are disabled.`;\n                card.appendChild(warning);\n            }\n            actions.append(keepOldBtn, keepNewBtn, keepBothBtn, removeBothBtn, manualBtn);\n'''
          if old not in text:
              raise SystemExit('browser actions anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # 4) Small regression guard for the two CodeRabbit findings.
          p = Path('tests/test_conflict_resolution_review_guards.py')
          p.write_text('''from pathlib import Path\n\n\ndef test_conflict_resolution_requires_validated_agent_session():\n    source = Path("memanto/cli/client/direct_client.py").read_text(encoding="utf-8")\n    start = source.index("    def resolve_conflict(")\n    end = source.index("    def ", start + 8)\n    body = source[start:end]\n    assert "self._get_validated_session_for_agent(agent_id)" in body\n    assert "namespace = session.namespace" in body\n\n\ndef test_unverified_conflicts_disable_destructive_ui_actions():\n    cli = Path("memanto/cli/commands/memory.py").read_text(encoding="utf-8")\n    ui = Path("memanto/app/ui/static/index.html").read_text(encoding="utf-8")\n    assert "Destructive resolution disabled for this unverified conflict" in cli\n    assert "binding.status === 'blocked'" in ui\n    assert "btn.disabled = true" in ui\n''', encoding='utf-8')

      - name: Install test dependencies
        run: python -m pip install -e . pytest pytest-asyncio

      - name: Run focused regression tests
        run: python -m pytest tests/test_conflict_reference_binding.py tests/test_conflict_resolution_review_guards.py -q

      - name: Ruff and syntax sanity
        run: |
          python -m pip install ruff
          python -m compileall -q memanto/cli/client/direct_client.py memanto/cli/commands/memory.py tests/test_conflict_resolution_review_guards.py
          ruff check memanto/cli/client/direct_client.py memanto/cli/commands/memory.py tests/test_conflict_resolution_review_guards.py

      - name: Commit review fixes
        run: |
          rm .github/workflows/solforge-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memanto/cli/client/direct_client.py memanto/cli/commands/memory.py memanto/app/ui/static/index.html tests/test_conflict_resolution_review_guards.py .github/workflows/solforge-review-fixes.yml
          git commit -m "security: address conflict resolution review findings"
          git push origin HEAD:security-bounty-1852-conflict-id-binding
