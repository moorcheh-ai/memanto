name: Verify Memanto PR 1960 full security patch

on:
  push:
    branches:
      - security/cross-process-session-lifecycle
    paths:
      - "memanto/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/verify-pr1960.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --dev
      - name: Diagnose Ruff import fix
        run: uv run ruff check --fix --diff tests/test_session_cross_process_recreation.py || true
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: MyPy
        run: uv run mypy .

  session-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --dev
      - name: Recreate version fallback
        run: echo '__version__ = "0.0.0.dev0"' > memanto/app/_version.py
      - name: Security / lifecycle / OS-process regression
        env:
          MOORCHEH_API_KEY: test-api-key
        run: uv run pytest -v --tb=short tests/test_session_cross_process_lifecycle.py tests/test_session_cross_process_recreation.py tests/test_agent_lifecycle_race.py tests/test_session_summary_concurrency.py tests/test_session_config_overlay.py tests/test_tool_sessions.py

  full-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --dev
      - name: Recreate version fallback
        run: echo '__version__ = "0.0.0.dev0"' > memanto/app/_version.py
      - name: Full Python suite
        env:
          MOORCHEH_API_KEY: test-api-key
        run: uv run pytest tests/ -v --tb=short

  openapi-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --dev
      - name: Compare regenerated OpenAPI
        run: |
          uv run python scripts/generate_openapi.py > /tmp/openapi.fresh.json
          diff -u sdks/typescript/openapi.json /tmp/openapi.fresh.json

  typescript-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: Install npm dependencies
        run: npm ci || npm install
      - name: Regenerate SDK
        run: npm run openapi:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
