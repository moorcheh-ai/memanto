name: Verify Memanto PR 1960 full security patch

on:
  push:
    branches:
      - security/cross-process-session-lifecycle
    paths:
      - "memanto/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/verify-pr1960.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: MyPy
        run: uv run mypy .

  session-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --dev
      - name: Recreate version fallback
        run: echo '__version__ = "0.0.0.dev0"' > memanto/app/_version.py
      - name: Security / lifecycle / OS-process regression
        env:
          MOORCHEH_API_KEY: test-api-key
        run: uv run pytest -v --tb=short tests/test_session_cross_process_lifecycle.py tests/test_session_cross_process_recreation.py tests/test_agent_lifecycle_race.py tests/test_session_summary_concurrency.py tests/test_session_config_overlay.py tests/test_tool_sessions.py

  full-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --dev
      - name: Recreate version fallback
        run: echo '__version__ = "0.0.0.dev0"' > memanto/app/_version.py
      - name: Full Python suite
        env:
          MOORCHEH_API_KEY: test-api-key
        run: uv run pytest tests/ -v --tb=short
