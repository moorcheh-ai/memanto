name: SOLFORGE verify security fixes

on:
  push:
    branches:
      - security-bounty-1852-conflict-id-binding
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-bounty-1852-conflict-id-binding
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -e . pytest pytest-asyncio pytest-timeout ruff

      - name: Focused security tests
        run: python -m pytest tests/test_conflict_reference_binding.py tests/test_conflict_resolution_review_guards.py -q

      - name: Ruff and syntax
        run: |
          python -m compileall -q memanto/app/utils/conflict_binding.py memanto/app/routes/memory.py memanto/cli/client/direct_client.py memanto/cli/commands/memory.py tests/test_conflict_reference_binding.py tests/test_conflict_resolution_review_guards.py
          ruff check memanto/app/utils/conflict_binding.py memanto/app/routes/memory.py memanto/cli/client/direct_client.py memanto/cli/commands/memory.py tests/test_conflict_reference_binding.py tests/test_conflict_resolution_review_guards.py

      - name: Remove temporary verifier after success
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/solforge-verify-security-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/solforge-verify-security-fixes.yml
          git commit -m "ci: remove temporary security verifier"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:security-bounty-1852-conflict-id-binding
