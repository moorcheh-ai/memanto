name: SOLFORGE conflict binding patch

on:
  push:
    branches:
      - security-bounty-1852-conflict-id-binding
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-bounty-1852-conflict-id-binding
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Integrate authoritative conflict binding
        shell: python
        run: |
          from pathlib import Path

          daily = Path('memanto/app/services/daily_analysis_service.py')
          text = daily.read_text(encoding='utf-8')

          import_anchor = 'from memanto.app.services.session_service import get_session_service\n'
          import_add = (
              'from memanto.app.services.session_service import get_session_service\n'
              'from memanto.app.utils.conflict_binding import (\n'
              '    bind_conflict_references,\n'
              '    extract_recent_memory_ids,\n'
              ')\n'
          )
          if 'bind_conflict_references' not in text:
              if import_anchor not in text:
                  raise SystemExit('daily analysis import anchor not found')
              text = text.replace(import_anchor, import_add, 1)

          bind_anchor = '''            # Add resolved=False, resolution, and timestamps to each conflict\n            for item in parsed:\n'''
          bind_block = '''            # Bind all model-generated object references to authoritative\n            # memories before they can be displayed or used for deletion.\n            # The new side must come from the recent session text being analyzed.\n            parsed = bind_conflict_references(\n                parsed,\n                client=client,\n                namespace=namespace,\n                recent_memory_ids=extract_recent_memory_ids(full_text),\n            )\n\n            # Add resolved=False, resolution, and timestamps to each conflict\n            for item in parsed:\n'''
          if 'recent_memory_ids=extract_recent_memory_ids(full_text)' not in text:
              if bind_anchor not in text:
                  raise SystemExit('daily analysis binding anchor not found')
              text = text.replace(bind_anchor, bind_block, 1)
          daily.write_text(text, encoding='utf-8')

          direct = Path('memanto/cli/client/direct_client.py')
          text = direct.read_text(encoding='utf-8')
          resolve_anchor = '''        namespace = agent_namespace(agent_id)\n\n        write_service = self._get_write_service()\n        result_details = {"action": action}\n'''
          resolve_block = '''        namespace = agent_namespace(agent_id)\n\n        # LLM-generated conflict IDs are untrusted capability references.\n        # Destructive actions must revalidate the server-generated binding\n        # immediately before any delete/store operation.\n        if action in {"keep_old", "keep_new", "remove_both", "manual"}:\n            from memanto.app.utils.conflict_binding import (\n                validate_conflict_reference_binding,\n            )\n\n            validate_conflict_reference_binding(\n                conflict,\n                client=self._get_moorcheh(),\n                namespace=namespace,\n            )\n\n        write_service = self._get_write_service()\n        result_details = {"action": action}\n'''
          if 'validate_conflict_reference_binding' not in text:
              if resolve_anchor not in text:
                  raise SystemExit('DirectClient resolve anchor not found')
              text = text.replace(resolve_anchor, resolve_block, 1)
          direct.write_text(text, encoding='utf-8')

      - name: Install focused test dependencies
        run: python -m pip install -e . pytest

      - name: Run focused security regression tests
        run: python -m pytest tests/test_conflict_reference_binding.py -q

      - name: Syntax and lint sanity
        run: |
          python -m compileall -q memanto/app/utils/conflict_binding.py memanto/app/services/daily_analysis_service.py memanto/cli/client/direct_client.py
          python -m pip install ruff
          ruff check memanto/app/utils/conflict_binding.py memanto/app/services/daily_analysis_service.py memanto/cli/client/direct_client.py tests/test_conflict_reference_binding.py

      - name: Commit integrated fix and remove temporary workflow
        run: |
          rm .github/workflows/solforge-conflict-binding-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memanto/app/services/daily_analysis_service.py memanto/cli/client/direct_client.py memanto/app/utils/conflict_binding.py tests/test_conflict_reference_binding.py .github/workflows/solforge-conflict-binding-patch.yml
          git commit -m "security: bind LLM conflict IDs before destructive resolution"
          git push origin HEAD:security-bounty-1852-conflict-id-binding
