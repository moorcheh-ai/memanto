[project]
name = "memanto-skill-memory"
version = "0.1.0"
description = "Memanto memory hooks for Claude Code and mattpocock-style developer skills"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["memanto"]

[project.scripts]
memanto-skill-memory = "memanto_skill_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memanto_skill_memory"]
